<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bgPro3" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="60%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </radialGradient>
    <radialGradient id="skin3" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <linearGradient id="hair3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="proShadow3" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <circle cx="60" cy="60" r="54" fill="url(#bgPro3)" filter="url(#proShadow3)"/>
  <ellipse cx="60" cy="22" rx="36" ry="12" fill="#ffffff" opacity="0.15"/>

  <!-- Suit & Tie -->
  <path d="M 28 114 C 28 92, 42 86, 60 86 C 78 86, 92 92, 92 114 Z" fill="#1e293b"/>
  <!-- White Collared Shirt -->
  <polygon points="52,86 68,86 60,102" fill="#ffffff"/>
  <!-- Tie -->
  <polygon points="58,92 62,92 64,114 56,114" fill="#0d9488"/>

  <!-- Neck -->
