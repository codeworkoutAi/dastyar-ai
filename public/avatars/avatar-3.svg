  <!-- Eyes & Eyebrows -->
  <path d="M 46 44 Q 52 41 56 43" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 64 43 Q 68 41 74 44" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="51" cy="50" r="2.2" fill="#0f172a"/>
  <circle cx="69" cy="50" r="2.2" fill="#0f172a"/>

  <!-- Distinguished Glasses -->
  <rect x="44" y="45" width="14" height="10" rx="3" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
  <rect x="62" y="45" width="14" height="10" rx="3" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="58" y1="50" x2="62" y2="50" stroke="#94a3b8" stroke-width="1.8"/>

  <!-- Smile -->
  <path d="M 54 67 Q 60 70 66 67" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
