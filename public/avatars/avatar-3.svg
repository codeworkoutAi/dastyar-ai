  <!-- Ears -->
  <circle cx="36" cy="54" r="6" fill="url(#skin3)"/>
  <circle cx="84" cy="54" r="6" fill="url(#skin3)"/>

  <!-- Face -->
  <ellipse cx="60" cy="54" rx="23" ry="26" fill="url(#skin3)"/>

  <!-- Scholarly Trimmed Beard -->
  <path d="M 44 58 C 44 76, 52 82, 60 82 C 68 82, 76 76, 76 58 C 76 72, 68 76, 60 76 C 52 76, 44 72, 44 58 Z" fill="url(#hair3)"/>

  <!-- Silver Hair -->
