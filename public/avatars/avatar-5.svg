      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>
    <radialGradient id="skin5" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fed7aa"/>
