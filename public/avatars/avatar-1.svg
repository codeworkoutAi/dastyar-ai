<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bgPro1" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="60%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <radialGradient id="skin1" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffdfba"/>
      <stop offset="70%" stop-color="#e2a77a"/>
      <stop offset="100%" stop-color="#b46e43"/>
    </radialGradient>
    <linearGradient id="hair1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="suit1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="proShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <circle cx="60" cy="60" r="54" fill="url(#bgPro1)" filter="url(#proShadow)"/>
  <ellipse cx="60" cy="22" rx="36" ry="12" fill="#ffffff" opacity="0.15"/>

  <!-- Shoulders / Turtleneck -->
  <path d="M 28 114 C 28 92, 42 86, 60 86 C 78 86, 92 92, 92 114 Z" fill="url(#suit1)"/>
  <!-- Turtleneck Collar -->
  <rect x="46" y="76" width="28" height="16" rx="8" fill="#1e293b"/>

  <!-- Neck -->
  <rect x="52" y="68" width="16" height="14" fill="url(#skin1)"/>

  <!-- Ears -->
  <circle cx="37" cy="54" r="6" fill="url(#skin1)"/>
  <circle cx="83" cy="54" r="6" fill="url(#skin1)"/>

  <!-- Face -->
  <ellipse cx="60" cy="54" rx="23" ry="26" fill="url(#skin1)"/>

  <!-- Modern Hair -->
  <path d="M 37 46 C 36 28, 52 22, 62 22 C 78 22, 85 30, 84 46 C 81 35, 74 31, 62 31 C 48 31, 40 37, 37 46 Z" fill="url(#hair1)"/>

  <!-- Eyebrows -->
  <path d="M 46 44 Q 52 42 56 44" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 64 44 Q 68 42 74 44" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Smart Specialist Glasses -->
  <rect x="44" y="47" width="14" height="11" rx="3" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <rect x="62" y="47" width="14" height="11" rx="3" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <line x1="58" y1="52" x2="62" y2="52" stroke="#60a5fa" stroke-width="2"/>
  <!-- Lens Glare -->
  <line x1="46" y1="49" x2="52" y2="56" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
  <line x1="64" y1="49" x2="70" y2="56" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>

  <!-- Eyes -->
  <circle cx="51" cy="52" r="2.2" fill="#0f172a"/>
  <circle cx="69" cy="52" r="2.2" fill="#0f172a"/>

  <!-- Nose -->
  <path d="M 59 56 L 61 61 L 58 62" fill="none" stroke="#b46e43" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Dignified Confident Smile -->
  <path d="M 54 67 Q 60 70 66 67" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
</svg>